apiVersion: v1
kind: Service
metadata:
  # Nome usado pelo Jenkinsfile em -Dsonar.host.url=http://sonarqube-service:9000
  name: sonarqube-service
  labels:
    app: sonarqube
spec:
  type: ClusterIP
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
