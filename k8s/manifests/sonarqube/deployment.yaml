apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  labels:
    app: sonarqube
spec:
  replicas: 1
  # SonarQube guarda estado no PVC e no Elasticsearch embutido (que nao suporta
  # duas instancias escrevendo ao mesmo tempo sobre o mesmo volume), entao mais
  # de 1 replica quebraria a analise. Mantemos 1 e usamos Recreate (em vez do
  # RollingUpdate padrao) para nunca ter dois pods de pe simultaneamente.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      # O Elasticsearch embutido no SonarQube exige vm.max_map_count >= 262144
      # no kernel do NO onde o pod roda. Esse initContainer privilegiado ajusta
      # esse parametro antes do container principal subir (mesmo truque usado
      # pelo Helm chart oficial do SonarQube / da Elastic).
      initContainers:
        - name: init-sysctl
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: sonarqube
          image: sonarqube:community
          ports:
            - containerPort: 9000
          resources:
            # SonarQube (Elasticsearch embutido) precisa de bem mais memoria que
            # os nossos microsservicos de estudo - nao da pra usar limites tao
            # enxutos quanto os do service-a/service-b aqui.
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "1500m"
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: sonarqube-data-pvc
