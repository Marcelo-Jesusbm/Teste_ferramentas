apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data-pvc
  labels:
    app: sonarqube
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Dados de analise (indices do Elasticsearch embutido, banco H2, etc).
      # Sem storageClassName: usa o provisioner default do cluster
      # (no k3s, isso e o "local-path" out-of-the-box).
      storage: 5Gi
