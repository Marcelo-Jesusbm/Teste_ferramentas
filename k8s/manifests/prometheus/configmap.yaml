apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'service-a'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['service-a:8081']

      - job_name: 'service-b'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['service-b:8082']
